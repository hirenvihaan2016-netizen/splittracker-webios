<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Split Tracker</title>
<meta name="theme-color" content="#1d6fd1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SplitTracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-32.png">
<style>
:root{
  --bg:#f3f6fa; --card:#ffffff; --text:#14202e; --sub:#5d6b7c; --line:#e1e7ee;
  --accent:#1d6fd1; --accent-text:#ffffff; --danger:#c62828; --ok:#1b7f4b; --input:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1620; --card:#18222f; --text:#e8eef5; --sub:#9aa9ba; --line:#2a3647;
         --accent:#5aa7ff; --accent-text:#08121f; --danger:#ff8a80; --ok:#6fd6a0; --input:#101923; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#app{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-right,0px) + 16px)
          calc(env(safe-area-inset-bottom,0px) + 32px) calc(env(safe-area-inset-left,0px) + 16px)}
h1{font-size:28px;font-weight:800;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sec-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:none;border:0;color:var(--text);font:inherit;font-weight:700;font-size:17px;
  padding:14px 16px;text-align:left;cursor:pointer}
.chev{font-size:20px;color:var(--sub)}
.sec-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.strong{font-weight:600;overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--sub)}
.small{font-size:12px;color:var(--sub);overflow-wrap:anywhere}
.big{font-size:34px;font-weight:700}
input[type=text],select{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--input);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
input[type=text]:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
label.field{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
.btn{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--accent);min-height:44px;
  padding:8px 14px;cursor:pointer;background:var(--accent);color:var(--accent-text)}
.btn.outline{background:transparent;color:var(--accent)}
.btn.text{background:transparent;border-color:transparent;color:var(--accent);padding:8px 10px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45}
.btn.small-btn{min-height:36px;padding:4px 10px;font-size:14px}
.check{display:flex;align-items:center;gap:10px;min-height:36px}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.exp{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.exp:first-of-type{border-top:0;padding-top:0}
.err{color:var(--danger);font-weight:600}
.banner{color:var(--accent);font-weight:700}
.hint{background:var(--card);border:1px dashed var(--accent);border-radius:12px;padding:12px 14px;font-size:14px}
.pay-in{width:120px}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="app.js"></script>
<noscript>Please enable JavaScript.</noscript>
</body>
</html>
